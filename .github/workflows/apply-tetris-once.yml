name: Aplicar grilla Tetris una vez

on:
  push:
    branches: [musgo-site-draft]
    paths:
      - '.github/workflows/apply-tetris-once.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: musgo-site-draft
          fetch-depth: 0
      - name: Construir flujo de entradas
        run: python tools/apply_tetris_grid.py
      - name: Guardar resultado y retirar trabajo temporal
        run: |
          rm -f .github/workflows/apply-tetris-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aplicar grilla Tetris de entradas [skip ci]"
          git push origin musgo-site-draft
