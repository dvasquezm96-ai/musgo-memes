name: Crear borrador MUSGO una vez

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generar la copia completa en la rama de borrador
        run: |
          git fetch origin musgo-site-draft
          git switch musgo-site-draft
          python tools/sync_musgo.py
          rm -f .github/workflows/sync-musgo-draft.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Crear copia completa de MUSGO [skip ci]"
            git push origin musgo-site-draft
          fi

      - name: Retirar este trabajo automático al terminar
        run: |
          git switch main
          git rm .github/workflows/build-musgo-once.yml
          git commit -m "Retirar generador temporal de MUSGO [skip ci]"
          git push origin main
